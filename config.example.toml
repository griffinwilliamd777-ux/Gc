# =============================================================================
# arb-bot Configuration
# =============================================================================
# Copy this file to config.toml and fill in your values.

[rpc]
# Your Ethereum RPC endpoint (use a dedicated node for lowest latency)
http_url = "https://eth-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
ws_url = "wss://eth-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
chain_id = 1
# How often to poll pool state (milliseconds). Lower = faster detection.
poll_interval_ms = 1000

[flashbots]
relay_url = "https://relay.flashbots.net"
enabled = true
# Submit bundles targeting up to N blocks ahead
max_block_offset = 3

[arbitrage]
# Minimum profit in wei to execute a trade (e.g., 0.01 ETH)
min_profit_wei = "10000000000000000"
# Maximum gas price in gwei
max_gas_gwei = 100
# Enable triangular arbitrage (A -> B -> C -> A)
enable_triangular = true
# Enable cross-DEX arbitrage (buy on DEX A, sell on DEX B)
enable_cross_dex = true
# Maximum hops for triangular arb paths
max_hops = 3

[execution]
# Name of the environment variable holding the private key
private_key_env = "ARB_BOT_PRIVATE_KEY"
# Slippage tolerance in basis points (50 = 0.5%)
slippage_bps = 50
# Gas limit safety multiplier
gas_limit_multiplier = 1.2
# Simulate transactions before sending
simulate_before_send = true
# Dry run mode: log opportunities but don't send transactions
dry_run = true

